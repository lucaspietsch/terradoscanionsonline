<style>
  :root{
    --fundo:#12130e; --papel:#1b1d15; --papel2:#23261b;
    --texto:#c9d28a; --oliva:#8a9a3b; --laranja:#e0883a;
    --linha:#3a3f27; --alerta:#ff3b30; --ok:#8fbf4a; --amarelo:#e6b032;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Consolas,"Courier New",monospace;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;color:var(--texto);font-family:var(--mono);padding:14px 12px 48px;min-height:100vh;
       background:
         linear-gradient(rgba(138,154,59,.05) 1px,transparent 1px) 0 0/28px 28px,
         linear-gradient(90deg,rgba(138,154,59,.05) 1px,transparent 1px) 0 0/28px 28px,
         radial-gradient(1000px 500px at 80% -10%,rgba(224,136,58,.12),transparent 60%),
         var(--fundo)}
  main{max-width:1100px;margin:0 auto}
  button{font:inherit;color:inherit;cursor:pointer}
  h1{font-size:clamp(1.25rem,4.5vw,2.1rem);margin:10px 0 2px;letter-spacing:1px;text-transform:uppercase;
     color:var(--laranja);text-shadow:0 0 14px rgba(224,136,58,.35)}
  h1::before{content:"> ";color:var(--oliva)}
  .sub{margin:0 0 14px;opacity:.8;font-size:.82rem;line-height:1.5}

  /* módulos do sistema integrado */
  .modulos{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--linha);padding-bottom:10px}
  .mod{padding:7px 14px;border:1px solid var(--linha);border-radius:8px;background:var(--papel);
       text-transform:uppercase;letter-spacing:1.5px;font-size:.75rem;color:var(--texto);text-decoration:none}
  .mod.on{border-color:var(--laranja);color:var(--laranja);box-shadow:0 0 12px rgba(224,136,58,.3)}
  .mod.off{opacity:.45;cursor:not-allowed}
  .mod small{opacity:.8;text-transform:none;letter-spacing:0;margin-left:4px}

  /* abas */
  .abas{display:flex;gap:6px;overflow-x:auto;padding:12px 0 6px;scrollbar-width:thin}
  .aba{flex:none;padding:7px 12px;border:1px solid var(--linha);border-radius:8px;background:var(--papel);
       text-transform:uppercase;letter-spacing:1.5px;font-size:.78rem;position:relative}
  .aba:hover{border-color:var(--laranja)}
  .aba.on{background:var(--laranja);color:var(--fundo);border-color:var(--laranja);font-weight:bold}
  .aba:disabled{opacity:.35;cursor:not-allowed}
  .aba .pt{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:6px;background:var(--linha)}
  .aba .pt.parcial{background:var(--amarelo)}
  .aba .pt.ok{background:var(--ok)}
  .aba.on .pt{box-shadow:0 0 0 1px var(--fundo)}
  .abas.folhas .aba{font-size:.72rem;letter-spacing:.8px;text-transform:none;border-radius:16px}
  .abas.folhas .aba.on{background:var(--oliva);border-color:var(--oliva)}

  /* painéis de resumo */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
  .card{background:linear-gradient(160deg,var(--papel2),var(--papel));border:1px solid var(--linha);
        border-radius:10px;padding:10px 12px}
  .card .l{font-size:.68rem;letter-spacing:2px;text-transform:uppercase;color:var(--oliva)}
  .card .v{font-size:1.5rem;font-weight:bold;color:var(--laranja);margin-top:2px}
  .card .v.bad{color:var(--alerta)} .card .v.am{color:var(--amarelo)}
  .card .s{font-size:.72rem;opacity:.75;margin-top:2px}

  .aviso{border:1px dashed var(--amarelo);color:var(--amarelo);background:rgba(230,176,50,.08);
         border-radius:8px;padding:9px 12px;font-size:.78rem;margin:10px 0;line-height:1.5}
  .vazio{border:1px dashed var(--linha);border-radius:12px;padding:34px 16px;text-align:center;opacity:.85;margin-top:10px}
  .vazio b{display:block;color:var(--laranja);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
  .vazio span{font-size:.82rem;line-height:1.6}

  /* tabela / grade */
  .cx{border:1px solid var(--linha);border-radius:10px;overflow:auto;background:var(--papel);max-height:72vh;margin-top:8px}
  table{border-collapse:separate;border-spacing:0;font-size:.78rem;width:max-content;min-width:100%}
  th,td{border-right:1px solid var(--linha);border-bottom:1px solid var(--linha);padding:0;text-align:center}
  thead th{position:sticky;top:0;z-index:3;background:var(--papel2);color:var(--oliva);font-weight:bold;height:30px;min-width:30px}
  thead th.hj{color:var(--laranja)}
  .nm{position:sticky;left:0;z-index:2;background:var(--papel2);text-align:left;padding:5px 8px;min-width:220px;max-width:300px;
      font-size:.74rem;line-height:1.3;border-right:2px solid var(--linha)}
  thead .nm{z-index:4}
  .nm i{font-style:normal;color:var(--laranja);font-weight:bold;margin-right:6px}
  td.c{width:30px;height:30px;font-size:.72rem;font-weight:bold}
  td.C{color:var(--ok)} td.C::before{content:"C"}
  td.NC{background:rgba(255,59,48,.2);color:#ff8a80;cursor:pointer;box-shadow:inset 0 0 0 1px var(--alerta)} td.NC::before{content:"NC"}
  td.NA{color:#7b8068;opacity:.8} td.NA::before{content:"NA"}
  td.F{background:repeating-linear-gradient(115deg,transparent 0 5px,rgba(138,154,59,.3) 5px 7px);color:transparent}
  td.S{background:repeating-linear-gradient(115deg,transparent 0 5px,rgba(224,136,58,.3) 5px 7px)}
  td.R{background:repeating-linear-gradient(0deg,transparent 0 4px,rgba(150,150,170,.25) 4px 5px)}
  td.nd{color:#555a40} td.nd::before{content:"·"}
  td.cp{opacity:.55} /* dia copiado do anterior */
  tr:hover td:not(.F):not(.S){background-color:rgba(138,154,59,.06)}

  /* inclinômetro */
  .inc td{padding:5px 8px;min-width:58px;font-variant-numeric:tabular-nums}
  .inc td.dia{position:sticky;left:0;background:var(--papel2);font-weight:bold;color:var(--laranja);z-index:1;min-width:64px}
  .inc td.hr{opacity:.8}
  .inc td.am{color:var(--amarelo);background:rgba(230,176,50,.12);font-weight:bold}
  .inc td.rd{color:#ff8a80;background:rgba(255,59,48,.16);font-weight:bold}
  .inc td.ob{text-align:left;min-width:160px;font-size:.72rem}
  .inc tr.folga td:not(.dia),.inc tr.semop td:not(.dia){background:repeating-linear-gradient(115deg,transparent 0 9px,rgba(138,154,59,.28) 9px 12px);color:var(--oliva);letter-spacing:3px}
  .inc tr.semop td:not(.dia){background:repeating-linear-gradient(115deg,transparent 0 9px,rgba(224,136,58,.28) 9px 12px);color:var(--laranja)}
  .inc td.pend{opacity:.5}
  .chk{display:inline-block;padding:1px 6px;border-radius:10px;font-size:.66rem;border:1px solid var(--amarelo);color:var(--amarelo)}

  /* zoom e mãozinha */
  .zbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px}
  .zbar button{min-width:36px;height:34px;padding:0 10px;border:1px solid var(--linha);border-radius:8px;background:var(--papel);
               color:var(--texto);font-weight:bold;letter-spacing:1px}
  .zbar button:hover{border-color:var(--laranja);color:var(--laranja)}
  .zbar button.on{background:var(--laranja);border-color:var(--laranja);color:var(--fundo)}
  .zbar .pct{min-width:54px;text-align:center;font-size:.8rem;color:var(--oliva)}
  .zbar .dica{font-size:.7rem;opacity:.65;margin-left:auto}
  .cx.mao{cursor:grab} .cx.mao.arrasta{cursor:grabbing;user-select:none}
  .cx.mao.arrasta *{pointer-events:none}
  .cx table{zoom:var(--z,1)}
  .legenda{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.74rem}
  .legenda span{display:inline-flex;align-items:center;gap:6px}
  .legenda i{display:inline-block;width:20px;height:16px;border-radius:3px;border:1px solid var(--linha);text-align:center;font-style:normal;font-size:.6rem;line-height:15px;font-weight:bold}

  .obs{margin-top:12px}
  .obs h3{margin:0 0 6px;font-size:.78rem;letter-spacing:2px;color:var(--oliva);border-bottom:1px dashed var(--linha);padding-bottom:3px;text-transform:uppercase}
  .ob-i{border:1px solid var(--linha);border-left:3px solid var(--alerta);background:var(--papel);border-radius:6px;padding:7px 10px;margin-bottom:6px;font-size:.78rem;line-height:1.45}
  .ob-i b{color:var(--laranja)}
  .ob-i small{display:block;opacity:.7;margin-top:2px}

  /* janela */
  #janela{position:fixed;inset:0;background:rgba(5,6,3,.7);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:12px;z-index:10}
  #janela.aberta{display:flex}
  .caixa{border:1px solid var(--oliva);border-radius:12px;background:var(--papel);padding:18px;width:min(92vw,460px);max-height:88vh;overflow:auto;
         box-shadow:0 0 30px rgba(138,154,59,.25);position:relative}
  .caixa h2{margin:0 0 10px;font-size:1rem;color:var(--laranja);text-transform:uppercase;letter-spacing:.5px}
  .fechar{margin-top:14px;background:transparent;color:var(--laranja);border:1px solid var(--laranja);border-radius:8px;padding:7px 16px;text-transform:uppercase;letter-spacing:1px}
  .fechar:hover{background:var(--laranja);color:var(--fundo)}
  footer{margin-top:26px;font-size:.7rem;opacity:.6;text-align:center;line-height:1.6}
  @media (max-width:560px){.nm{min-width:150px;max-width:170px;font-size:.68rem}}
</style>
</head>

/* ============================================================
   APLICATIVO
   ============================================================ */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad = n => String(n).padStart(2,"0");
const diasNoMes = (m) => new Date(ANO, m, 0).getDate();           // m = 1..12
const chave = m => ANO+"-"+pad(m);
const hoje = new Date();
const hojeKey = [hoje.getFullYear(), hoje.getMonth()+1, hoje.getDate()];

let mesSel = (()=>{ try{ const s=localStorage.getItem("ct:mes"); if(s) return +s; }catch(e){} return hojeKey[0]===ANO ? hojeKey[1] : 10; })();
let folhaSel = (()=>{ try{ return localStorage.getItem("ct:folha")||"incl"; }catch(e){ return "incl"; } })();
function guarda(){ try{ localStorage.setItem("ct:mes",mesSel); localStorage.setItem("ct:folha",folhaSel); }catch(e){} }

function desenhaModulos(){
  $("#modulos").innerHTML = MODULOS.map(m => m.on
    ? `<span class="mod on">${esc(m.nome)}</span>`
    : `<span class="mod off" title="${esc(m.nome)} entra no sistema integrado em breve">${esc(m.nome)}<small>(${esc(m.off)})</small></span>`).join("");
}

function statusMes(m){
  const d = DADOS[chave(m)];
  return d ? d.status : "vazio";
}

function desenhaMeses(){
  $("#meses").innerHTML = MESES.map((n,i)=>{
    const m=i+1, st=statusMes(m);
    const futuro = ANO>hojeKey[0] || (ANO===hojeKey[0] && m>hojeKey[1]);
    return `<button class="aba ${m===mesSel?"on":""}" role="tab" aria-selected="${m===mesSel}" data-m="${m}" ${futuro?"disabled":""}>${n.slice(0,3)}<span class="pt ${st==="vazio"?"":st}"></span></button>`;
  }).join("");
  document.querySelectorAll("#meses .aba").forEach(b=>b.onclick=()=>{ mesSel=+b.dataset.m; guarda(); tudo(); });
}

function desenhaFolhas(){
  $("#folhas").innerHTML = FOLHAS.map(f=>`<button class="aba ${f.id===folhaSel?"on":""}" role="tab" data-f="${f.id}">${esc(f.nome)}</button>`).join("");
  document.querySelectorAll("#folhas .aba").forEach(b=>b.onclick=()=>{ folhaSel=b.dataset.f; guarda(); folhas_conteudo(); desenhaFolhas(); });
}

/* classificação das leituras do inclinômetro */
function classeCabo(v){ if(v==null) return ""; if(v>=FAIXA_CABO.min-1e-9 && v<=FAIXA_CABO.max+1e-9) return ""; return Math.abs(v-0.95)>0.25 ? "rd" : "am"; }
function classeTrolley(v){ if(v==null) return ""; return FAIXA_TROLLEY.some(x=>Math.abs(x-v)<1e-9) ? "" : (v>0.3 ? "rd" : "am"); }
const fmt = (v,casas) => v==null ? "" : v.toFixed(casas);

function resumo(){
  const d = DADOS[chave(mesSel)];
  const alvo = $("#resumo");
  if(!d){ alvo.innerHTML=""; return; }
  const dias = Object.keys(d.incl||{}).length;
  let fora=0;
  Object.values(d.incl||{}).forEach(r=>{ for(let i=0;i<6;i++) if(classeCabo(r[i])) fora++; if(classeTrolley(r[6])) fora++; });
  let nc=0, obs=0;
  Object.values(d.grade||{}).forEach(f=>{ Object.values(f.NC||{}).forEach(a=>nc+=a.length); obs+=(f.obs||[]).length; });
  alvo.innerHTML = `<div class="cards">
    <div class="card"><div class="l">Dias medidos</div><div class="v">${dias}</div><div class="s">${(d.folgas||[]).length} folgas · ${(d.semOperacao||[]).length} sem operação</div></div>
    <div class="card"><div class="l">Leituras fora do padrão</div><div class="v ${fora?"am":""}">${fora}</div><div class="s">inclinômetro</div></div>
    <div class="card"><div class="l">Não conformidades</div><div class="v ${nc?"bad":""}">${nc}</div><div class="s">${obs} observações</div></div>
    <div class="card"><div class="l">Situação</div><div class="v" style="font-size:1rem;margin-top:8px">${d.status==="ok"?"Conferido":"Parcial"}</div><div class="s">até o dia ${d.ultimoDia}</div></div>
  </div>`;
}

function vazioMes(){
  return `<div class="vazio"><b>Aguardando transcrição</b><span>${MESES[mesSel-1]} de ${ANO} ainda não foi transcrito das folhas do papel.<br>Os dados entram aqui, folha por folha, assim que forem conferidos.</span></div>`;
}

function tabelaIncl(d){
  const n = diasNoMes(mesSel);
  const temHora = Object.values(d.incl).some(r=>r[7]);
  const nc = temHora ? 10 : 9;
  let h = `<table class="inc"><thead><tr><th class="nm" style="min-width:64px">Dia</th>${temHora?"<th>Hora</th>":""}<th>Cabo 1</th><th>Cabo 2</th><th>Cabo 3</th><th>Cabo 4</th><th>Cabo 5</th><th>Cabo 6</th><th>Trolley</th><th>Autor</th><th>Obs.</th></tr></thead><tbody>`;
  for(let dia=1; dia<=n; dia++){
    const wd = new Date(ANO,mesSel-1,dia).toLocaleDateString("pt-BR",{weekday:"short"}).replace(".","");
    const rot = `${pad(dia)} <small style="opacity:.6;font-weight:normal">${wd}</small>`;
    const r = d.incl[dia];
    if(r){
      h += `<tr><td class="dia">${rot}</td>${temHora?`<td class="hr">${esc(r[7]||"")}</td>`:""}`
        + r.slice(0,6).map(v=>`<td class="${classeCabo(v)}">${fmt(v,1)}</td>`).join("")
        + `<td class="${classeTrolley(r[6])}">${fmt(r[6],2)}</td><td>${esc(r[8]||"")}</td><td class="ob">${r[9]?`<span class="chk">${String(r[9]).startsWith("copiado")?"copiado":"conferir"}</span> ${esc(r[9]===true?"":r[9])}`:""}</td></tr>`;
    } else if((d.folgas||[]).includes(dia)){
      h += `<tr class="folga"><td class="dia">${rot}</td><td colspan="${nc}">F O L G A</td></tr>`;
    } else if((d.semRegistro||[]).includes(dia)){
      h += `<tr class="semop"><td class="dia">${rot}</td><td colspan="${nc}">SEM REGISTRO NA FOLHA</td></tr>`;
    } else if((d.semOperacao||[]).includes(dia) || (d.inclSemOp||[]).includes(dia)){
      h += `<tr class="semop"><td class="dia">${rot}</td><td colspan="${nc}">SEM OPERAÇÃO</td></tr>`;
    } else {
      h += `<tr><td class="dia">${rot}</td><td colspan="${nc}" class="pend">—</td></tr>`;
    }
  }
  return h + "</tbody></table>";
}

function formDe(f,dados){ return (dados&&dados.form)||f.form; }
function textoItem(f,dados,it){ return ((dados&&dados.extra)||{})[it] || ITENS[formDe(f,dados)][it-1]; }
function tabelaGrade(f, d){
  const dados = (d.grade||{})[f.id];
  const n = diasNoMes(mesSel);
  if(!dados) return vazioFolha(f);
  const itens = []; const nI = dados.n || ITENS[formDe(f,dados)].length;
  for(let i=1;i<=nI;i++) itens.push(textoItem(f,dados,i));
  let h = `<table><thead><tr><th class="nm">Item</th>`;
  for(let dia=1; dia<=n; dia++) h += `<th class="${(hojeKey[1]===mesSel&&hojeKey[2]===dia&&hojeKey[0]===ANO)?"hj":""}">${dia}</th>`;
  h += `</tr></thead><tbody>`;
  itens.forEach((txt,i)=>{
    const it=i+1;
    const nc=(dados.NC||{})[it]||[], na=(dados.NA||{})[it]||[];
    h += `<tr><td class="nm"><i>${it}</i>${esc(txt)}</td>`;
    for(let dia=1; dia<=n; dia++){
      let cl, tit="";
      if((d.folgas||[]).includes(dia)) cl="F";
      else if((d.semRegistro||[]).includes(dia)) cl="R";
      else if((d.semOperacao||[]).includes(dia) || (dados.semOp||[]).includes(dia)) cl="S";
      else if(dia>d.ultimoDia || dia<(dados.desde||1) || dia<((dados.de||{})[it]||1)) cl="nd";
      else if(nc.includes(dia)) cl="NC";
      else if(na.includes(dia)||(dados.NAtodos||[]).includes(it)) cl="NA";
      else cl="C";
      const cp=(d.copiados||[]).includes(dia)?" cp":"";
      h += `<td class="c ${cl}${cp}" ${cl==="NC"?`data-it="${it}" data-d="${dia}"`:""}></td>`;
    }
    h += `</tr>`;
  });
  return h + "</tbody></table>";
}

function vazioFolha(f){
  if(f.desde && mesSel<f.desde)
    return `<div class="vazio"><b>${esc(f.nome)}</b><span>Esta folha só existe a partir de ${MESES[f.desde-1]} (o formulário ainda não era usado em ${MESES[mesSel-1]}).</span></div>`;
  if((((DADOS[chave(mesSel)]||{}).semFolha)||[]).includes(f.id))
    return `<div class="vazio"><b>${esc(f.nome)}</b><span>Esta folha não consta nos documentos de ${MESES[mesSel-1]}.</span></div>`;
  return `<div class="vazio"><b>${esc(f.nome)}</b><span>Folha ainda não transcrita para ${MESES[mesSel-1]}.</span></div>`;
}

function blocoObs(f, d){
  const dados=(d.grade||{})[f.id];
  if(!dados||!(dados.obs||[]).length) return "";
  return `<div class="obs"><h3>Observações (não conformidades)</h3>`+dados.obs.map(o=>
    `<div class="ob-i"><b>${esc(o.d)}</b> · ${esc(o.txt)}<small>${o.prazo?`Prazo: ${esc(o.prazo)} · `:""}${o.resp?`Responsável: ${esc(o.resp)} · `:""}${o.real?`Corrigido em: ${esc(o.real)}`:""}</small></div>`).join("")+`</div>`;
}

let zoomV = (()=>{ try{ const v=parseFloat(localStorage.getItem("ct:zoom")); if(v>=.5&&v<=3) return v; }catch(e){} return 1; })();
let maoOn = (()=>{ try{ return localStorage.getItem("ct:mao")!=="0"; }catch(e){ return true; } })();
const barraZoom = () => `<div class="zbar" id="zbar">
    <button data-z="-" title="Diminuir (Ctrl + roda do mouse)" aria-label="Diminuir zoom">−</button>
    <span class="pct" id="zpct">${Math.round(zoomV*100)}%</span>
    <button data-z="+" title="Aumentar (Ctrl + roda do mouse)" aria-label="Aumentar zoom">+</button>
    <button data-z="0" title="Voltar a 100%">100%</button>
    <button data-z="mao" class="${maoOn?"on":""}" title="Arrastar a tabela com o mouse" aria-pressed="${maoOn}">✋ Mão</button>
    <span class="dica">arraste para mover · Ctrl + roda para zoom</span></div>`;
function ligaZoom(alvo){
  const cx = alvo.querySelector(".cx"); if(!cx) return;
  const tb = cx.querySelector("table");
  const aplica = (v)=>{
    zoomV = Math.min(3, Math.max(.5, Math.round(v*100)/100));
    cx.style.setProperty("--z", zoomV);
    const pct=$("#zpct"); if(pct) pct.textContent=Math.round(zoomV*100)+"%";
    try{ localStorage.setItem("ct:zoom",zoomV); }catch(e){}
  };
  aplica(zoomV);
  cx.classList.toggle("mao", maoOn);
  $("#zbar").onclick = e=>{
    const b=e.target.closest("button"); if(!b) return;
    if(b.dataset.z==="+") aplica(zoomV+.25);
    else if(b.dataset.z==="-") aplica(zoomV-.25);
    else if(b.dataset.z==="0") aplica(1);
    else { maoOn=!maoOn; try{ localStorage.setItem("ct:mao",maoOn?"1":"0"); }catch(e){} b.classList.toggle("on",maoOn); b.setAttribute("aria-pressed",maoOn); cx.classList.toggle("mao",maoOn); }
  };
  // Ctrl + roda do mouse (ou pinça no trackpad) = zoom
  cx.addEventListener("wheel", e=>{ if(!(e.ctrlKey||e.metaKey)) return; e.preventDefault(); aplica(zoomV + (e.deltaY<0?.15:-.15)); }, {passive:false});
  // mãozinha: arrastar para mover
  let ini=null, moveu=false;
  cx.addEventListener("pointerdown", e=>{
    if(!maoOn || e.pointerType==="touch" || e.button!==0) return;
    ini={x:e.clientX,y:e.clientY,l:cx.scrollLeft,t:cx.scrollTop}; moveu=false;
  });
  window.addEventListener("pointermove", e=>{
    if(!ini) return;
    const dx=e.clientX-ini.x, dy=e.clientY-ini.y;
    if(!moveu && Math.hypot(dx,dy)<5) return;
    if(!moveu){ moveu=true; cx.classList.add("arrasta"); }
    cx.scrollLeft=ini.l-dx; cx.scrollTop=ini.t-dy;
  });
  const solta=()=>{ if(!ini) return; ini=null; cx.classList.remove("arrasta"); if(moveu) setTimeout(()=>{moveu=false},0); };
  window.addEventListener("pointerup", solta); window.addEventListener("pointercancel", solta);
  // não abre a janela do NC se foi um arrasto
  cx.addEventListener("click", e=>{ if(moveu){ e.stopPropagation(); e.preventDefault(); } }, true);
}

function folhas_conteudo(){
  const f = FOLHAS.find(x=>x.id===folhaSel)||FOLHAS[0];
  const d = DADOS[chave(mesSel)];
  const alvo = $("#conteudo");
  if(!d){ alvo.innerHTML = (f.desde && mesSel<f.desde) ? vazioFolha(f) : vazioMes(); legenda(f); return; }
  if((d.semFolha||[]).includes(f.id) || (f.desde && mesSel<f.desde)){ alvo.innerHTML = vazioFolha(f); legenda(f); return; }
  let h = d.nota?`<div class="aviso">${esc(d.nota)}</div>`:"";
  if(f.tipo==="incl"){
    h += (d.incl && Object.keys(d.incl).length) ? barraZoom()+`<div class="cx">${tabelaIncl(d)}</div>` : vazioFolha(f);
  } else {
    const t = tabelaGrade(f,d);
    h += t.startsWith("<table") ? barraZoom()+`<div class="cx">${t}</div>${blocoObs(f,d)}` : t;
  }
  alvo.innerHTML = h;
  alvo.querySelectorAll("td.NC").forEach(td=>td.onclick=()=>abreNC(f,d,+td.dataset.it,+td.dataset.d));
  ligaZoom(alvo);
  legenda(f);
}

function abreNC(f,d,it,dia){
  const obs=((d.grade||{})[f.id].obs||[]).filter(o=>o.item===it);
  $("#caixa").innerHTML = `<h2>Item ${it} · dia ${pad(dia)}/${pad(mesSel)}</h2><p style="margin:0 0 8px;font-size:.85rem">${esc(textoItem(f,(d.grade||{})[f.id],it))}</p>`
    + (obs.length? obs.map(o=>`<div class="ob-i"><b>${esc(o.d)}</b> · ${esc(o.txt)}<small>${o.prazo?`Prazo: ${esc(o.prazo)} `:""}${o.resp?`· ${esc(o.resp)} `:""}${o.real?`· corrigido ${esc(o.real)}`:""}</small></div>`).join("") : `<div class="ob-i">Sem observação registrada na folha.</div>`)
    + `<button class="fechar" id="fx">Fechar</button>`;
  $("#janela").classList.add("aberta"); $("#fx").onclick=fecha;
}
function fecha(){ $("#janela").classList.remove("aberta"); }
$("#janela").addEventListener("click",e=>{ if(e.target.id==="janela") fecha(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") fecha(); });

function legenda(f){
  $("#legenda").innerHTML = f.tipo==="incl"
   ? `<span><i style="background:rgba(230,176,50,.12);color:var(--amarelo)">1.1</i> fora da faixa 0.9–1.0 (cabos) ou 0.00/0.05/0.1 (trolley)</span><span><i style="background:rgba(255,59,48,.16);color:#ff8a80">1.3</i> muito fora do padrão</span><span><i style="background:repeating-linear-gradient(115deg,transparent 0 3px,rgba(138,154,59,.5) 3px 5px)"></i> folga</span><span><i style="background:repeating-linear-gradient(115deg,transparent 0 3px,rgba(224,136,58,.5) 3px 5px)"></i> sem operação</span>`
   : `<span><i style="color:var(--ok)">C</i> Conforme</span><span><i style="color:#ff8a80;background:rgba(255,59,48,.2)">NC</i> Não conforme</span><span><i style="color:#7b8068">NA</i> Não se aplica</span><span><i style="background:repeating-linear-gradient(115deg,transparent 0 3px,rgba(138,154,59,.5) 3px 5px)"></i> folga</span><span><i style="background:repeating-linear-gradient(115deg,transparent 0 3px,rgba(224,136,58,.5) 3px 5px)"></i> sem operação</span><span><i style="opacity:.55;color:var(--ok)">C</i> dia copiado do anterior</span>`;
}

function tudo(){ desenhaMeses(); resumo(); desenhaFolhas(); folhas_conteudo(); }
desenhaModulos(); tudo();
</script>
