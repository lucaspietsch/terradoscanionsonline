<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caixa Tirolesa dos Cânions 2026</title>
<meta name="description" content="Controle de caixa da Tirolesa dos Cânions · Serra Geral Vertical — revisão 2.9, em formato de aplicativo para celular.">
<meta name="robots" content="noindex, nofollow">

<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  --bg:#f3f5f1; --card:#fff; --ink:#1f2a22; --muted:#667267; --line:#e1e6df; --soft:#eef2ec;
  --brand:#2f5d3a; --brand2:#4a7c59; --brand-ink:#fff;
  --blue:#2f6fb5; --red:#c0392b; --red2:#8e2418; --green:#2e9e5b; --orange:#e08a2e; --purple:#7e57a8; --teal:#1f8a8a; --olive:#8a9659; --gray:#7b857d; --amber:#c98a00;
  --shadow:0 1px 2px rgba(20,30,20,.06),0 4px 14px rgba(20,30,20,.06);
  --sab:env(safe-area-inset-bottom,0px); --sat:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1511; --card:#18211b; --ink:#e8efe9; --muted:#9aa89d; --line:#2a362d; --soft:#212d24;
    --brand:#3f7a4d; --brand2:#5b9a6a; --blue:#5b9be0; --red:#e5655a; --red2:#f08b80; --green:#4cc37e; --orange:#f0a24c; --purple:#a98bd0; --teal:#4cb8b8; --olive:#a9b67a; --gray:#98a39b; --amber:#e6b032;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1511; --card:#18211b; --ink:#e8efe9; --muted:#9aa89d; --line:#2a362d; --soft:#212d24;
  --brand:#3f7a4d; --brand2:#5b9a6a; --blue:#5b9be0; --red:#e5655a; --red2:#f08b80; --green:#4cc37e; --orange:#f0a24c; --purple:#a98bd0; --teal:#4cb8b8; --olive:#a9b67a; --gray:#98a39b; --amber:#e6b032;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4;min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--brand2)}
.num{font-variant-numeric:tabular-nums}

/* app bar */
.bar{position:sticky;top:0;z-index:30;background:var(--brand);color:#fff;padding:calc(10px + var(--sat)) 14px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.bar h1{font-size:17px;font-weight:700;line-height:1.15;flex:1;min-width:0}
.bar h1 small{display:block;font-size:11.5px;font-weight:500;opacity:.85;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:inherit;font-size:20px}
.bar .ibtn:active{background:rgba(255,255,255,.18)}
main{padding:12px 12px calc(86px + var(--sab));max-width:820px;margin:0 auto}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding:4px 2px calc(4px + var(--sab));box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.nav a{flex:1;min-width:0;text-decoration:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 4px;border-radius:12px;font-size:10.5px;font-weight:600}
.nav a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav a.on{color:var(--brand2)}
.nav a.on svg{stroke-width:2.3}

/* blocks */
h2.sec{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 4px 8px;font-weight:700;display:flex;align-items:center;gap:8px}
h2.sec .sp{flex:1}
h2.sec button{font-size:12px;text-transform:none;letter-spacing:0;font-weight:600;color:var(--brand2);padding:4px 8px;border-radius:8px;background:var(--soft)}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.card h3{font-size:14px;font-weight:700;margin-bottom:8px}
.card h3 small{font-weight:500;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px 13px;border-left:5px solid var(--gray);min-width:0;text-align:left;width:100%;display:block}
.kpi .l{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);line-height:1.2}
.kpi .v{font-size:20px;font-weight:800;margin-top:5px;line-height:1.1;overflow-wrap:anywhere}
.kpi .s{font-size:11.5px;color:var(--muted);margin-top:3px}
.kpi.c-red{border-color:var(--red)}.kpi.c-green{border-color:var(--green)}.kpi.c-orange{border-color:var(--orange)}.kpi.c-blue{border-color:var(--blue)}.kpi.c-purple{border-color:var(--purple)}.kpi.c-olive{border-color:var(--olive)}.kpi.c-amber{border-color:var(--amber)}.kpi.c-teal{border-color:var(--teal)}.kpi.c-brand{border-color:var(--brand2)}
.pos{color:var(--green)}.neg{color:var(--red)}.warn{color:var(--amber)}.mut{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.chip.ok{background:rgba(46,158,91,.15);color:var(--green)}
.chip.bad{background:rgba(192,57,43,.14);color:var(--red)}
.chip.am{background:rgba(201,138,0,.16);color:var(--amber)}
.chip.bl{background:rgba(47,111,181,.14);color:var(--blue)}
.chip.pu{background:rgba(126,87,168,.15);color:var(--purple)}
.chip.or{background:rgba(224,138,46,.18);color:var(--orange)}
.chip.te{background:rgba(31,138,138,.15);color:var(--teal)}

/* chips row / segmented */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;padding:7px 13px;border-radius:99px;background:var(--card);box-shadow:var(--shadow);font-weight:700;font-size:13px;color:var(--muted);border:1.5px solid transparent}
.pill.on{background:var(--brand);color:#fff}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:8px 4px;border-radius:10px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

/* lists */
.list{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px;padding:11px 13px;border-bottom:1px solid var(--line);width:100%;text-align:left;min-height:52px}
.row:last-child{border-bottom:0}
button.row:active,.row.tap:active{background:var(--soft)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:650;overflow-wrap:anywhere;display:block}
.row .d{display:block;font-size:12px;color:var(--muted);margin-top:1px;overflow-wrap:anywhere}
.row .amt{font-weight:800;text-align:right;white-space:nowrap}
.row .amt small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.bullet{width:6px;align-self:stretch;border-radius:4px;flex:0 0 6px;background:var(--gray);margin:-4px 0}
.day .dd{width:42px;text-align:center;flex:0 0 42px}
.day .dd b{font-size:19px;display:block;line-height:1}
.day .dd small{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}
.day.off{opacity:.62}
.day .dd{position:relative}
.apr{position:absolute;top:-9px;right:-6px;width:21px;height:21px;border-radius:50%;background:var(--amber);color:#fff;font-weight:900;font-size:14px;line-height:21px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.3);cursor:pointer}
.day.off .apr{opacity:1}
.empty{padding:26px 14px;text-align:center;color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.kv b{text-align:right}
.note{font-size:12.5px;color:var(--muted);line-height:1.5}
.note li{margin-left:18px;margin-bottom:4px}
.alert{display:flex;gap:10px;padding:11px 13px;border-radius:14px;background:rgba(201,138,0,.13);border:1px solid rgba(201,138,0,.35);margin-bottom:8px;font-size:13px;text-align:left;width:100%}
.alert.bad{background:rgba(192,57,43,.1);border-color:rgba(192,57,43,.3)}
.alert .ic{font-size:16px}

/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:16px;background:var(--card);box-shadow:var(--shadow);margin-bottom:12px}
table{border-collapse:separate;border-spacing:0;font-size:12.5px;width:100%}
th,td{padding:8px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:#fff;background:var(--brand);position:sticky;top:0;font-weight:700;white-space:normal;line-height:1.15;vertical-align:bottom}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:2;font-weight:700;border-right:1px solid var(--line)}
th:first-child{background:var(--brand);z-index:3}
tr.tot td{background:var(--soft);font-weight:800}
tr.tot td:first-child{background:var(--soft)}
tr.tap{cursor:pointer}
tr.tap:active td{background:var(--soft)}
td.r{color:var(--red)}td.g{color:var(--green)}td.o{color:var(--orange)}

/* charts */
.chart{width:100%;display:block}
.chart text{fill:var(--muted);font-size:9.5px;font-family:inherit}
.chart .grid line{stroke:var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;margin-bottom:9px;text-align:left;width:100%}
.hbar .nm{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .vv{font-size:12.5px;font-weight:800}
.hbar .tr{grid-column:1/-1;height:9px;border-radius:6px;background:var(--soft);overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:6px;background:var(--orange)}
#tip{position:fixed;z-index:80;pointer-events:none;background:#111;color:#fff;font-size:12px;padding:6px 9px;border-radius:9px;max-width:230px;opacity:0;transition:opacity .12s;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#tip.on{opacity:.96}

/* sheet / modal */
.scrim{position:fixed;inset:0;background:rgba(10,18,12,.5);z-index:60;opacity:0;transition:opacity .2s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--card);border-radius:22px 22px 0 0;max-height:92vh;display:flex;flex-direction:column;transform:translateY(102%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-width:640px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet.on{transform:none}
.sheet header{padding:14px 16px 8px;display:flex;align-items:center;gap:10px}
.sheet header h3{flex:1;font-size:17px}
.sheet .body{overflow-y:auto;padding:4px 16px 12px;-webkit-overflow-scrolling:touch}
.sheet footer{display:flex;gap:10px;padding:10px 16px calc(12px + var(--sab));border-top:1px solid var(--line)}
.btn{padding:12px 16px;border-radius:13px;font-weight:700;background:var(--soft);color:var(--ink);flex:1;text-align:center}
.btn.pri{background:var(--brand);color:#fff}
.btn.dng{background:rgba(192,57,43,.12);color:var(--red);flex:0 0 auto}
.btn.sm{padding:8px 12px;font-size:13px;flex:0 0 auto}
.f{margin-bottom:12px}
.f label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-size:16px;appearance:none;-webkit-appearance:none}
.f select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--brand2)}
.f textarea{min-height:70px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fab{position:fixed;right:16px;bottom:calc(78px + var(--sab));z-index:25;width:56px;height:56px;border-radius:18px;background:var(--orange);color:#fff;font-size:30px;font-weight:300;box-shadow:0 6px 18px rgba(0,0,0,.28);display:grid;place-items:center;line-height:1}
.fab:active{transform:scale(.95)}
.menu a,.menu button.mi{display:flex;align-items:center;gap:14px;padding:14px 4px;width:100%;text-align:left;font-size:16px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.menu .mi:last-child{border-bottom:0}
.menu span.e{width:26px;text-align:center;font-size:19px}
.menu small{display:block;color:var(--muted);font-size:12px}
#toast{position:fixed;left:50%;bottom:calc(90px + var(--sab));transform:translate(-50%,20px);background:#1d2a21;color:#fff;padding:10px 16px;border-radius:14px;z-index:90;font-size:14px;opacity:0;transition:.2s;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#toast.on{opacity:1;transform:translate(-50%,0)}
.search{position:relative;margin-bottom:10px}
.search input{width:100%;padding:11px 12px 11px 38px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:16px}
.search input:focus{outline:none;border-color:var(--brand2)}
.search:before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.7}
.sel-inline{padding:6px 24px 6px 9px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:12.5px;font-weight:700;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 12px) 52%,calc(100% - 8px) 52%;background-size:4px 4px;background-repeat:no-repeat;max-width:132px}
.sel-inline.s-conf{color:var(--amber);border-color:rgba(201,138,0,.5)}
.sel-inline.s-coord{color:var(--green);border-color:rgba(46,158,91,.5)}
.sel-inline.s-emp{color:var(--blue);border-color:rgba(47,111,181,.5)}
.hide{display:none!important}
.foot{text-align:center;color:var(--muted);font-size:11.5px;margin:18px 0 6px}

@media (min-width:700px){
  .grid.g3{grid-template-columns:repeat(3,1fr)}
  .grid.g4{grid-template-columns:repeat(4,1fr)}
  .sheet{border-radius:22px;bottom:4vh}
}
@media print{
  .bar,.nav,.fab,.chips,.seg,#toast,#tip,.noprint{display:none!important}
  body{background:#fff;color:#000}
  main{padding:0;max-width:none}
  .card,.kpi,.list,.tw{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  th{background:#2f5d3a!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

  <h1 id="ttl">Caixa 2026<small id="sub"></small></h1>

</div>
<main id="view"></main>
<button class="fab hide" id="fab" aria-label="Adicionar">+</button>
<nav class="nav" id="nav"></nav>
<div id="tip"></div>
<div id="toast"></div>
<div id="layer"></div>
<input type="file" id="fileIn" accept="application/json,.json" class="hide">

<script>

const dash0 = v => (v == null || z(v)) ? '–' : brl0(v);

const TIPOS = ['Entrada','Sangria Gabriel','Sangria – outros','Ajuste de caixa (sobrou)','Ajuste de caixa (faltou)'];

      const r = localStorage.getItem(k);

    } catch (e) {}

}
function freshState() { const s = clone(SEED); s.edits = 0; return s; }

const SAVED = readSaved();

const UI = {tab:'dia', pagCat:'Todas', coordMes:null, coordPP:'Todos', custos:'grupo', nfMes:'Todos', nfSit:'Todas', nfQ:'', dest:'Todos'};
const lastMes = () => { for (let i = S.meses.length - 1; i >= 0; i--) if (S.meses[i].dias.some(d => d.s === 'Caixa aberto') || S.meses[i].pag.length) return i; return 0; };

let C;
function compute() {
  let carry = NUM(S.abertura);

  S.meses.forEach((m, mi) => {
    const c = {m, mi, abertura:carry, dias:[], aberto:0, difDias:0};
    const ent = {}, sai = {};
    m.lanc.forEach(l => { ent[l.d] = (ent[l.d] || 0) + NUM(l.e); sai[l.d] = (sai[l.d] || 0) + NUM(l.s); });
    let lastInf = null;
    m.dias.forEach(d => {
      const o = {d:d.d, s:d.s, f:d.f, ent:0, sai:0, abertura:null, calc:null, dif:null};
      if (d.s === 'Caixa aberto') {
        c.aberto++;
        o.abertura = carry; o.ent = ent[d.d] || 0; o.sai = sai[d.d] || 0; o.calc = carry + o.ent - o.sai;
        if (d.f != null) { o.dif = d.f - o.calc; lastInf = d.f; if (!z(o.dif)) c.difDias++; }
        carry = d.f != null ? d.f : o.calc;
      }
      c.dias.push(o);
    });
    c.ent = sum(m.lanc, l => l.e);
    c.sai = sum(m.lanc, l => l.s);
    c.gab = sum(m.lanc.filter(l => l.t === 'Sangria Gabriel'), l => l.s);
    c.outras = sum(m.lanc.filter(l => l.t === 'Sangria – outros'), l => l.s);
    const cat = k => sum(m.pag.filter(p => p.c === k), p => p.v);
    c.assid = cat('Assiduidade'); c.custos = cat('Custo / conta paga'); c.bonif = cat('Bonificação'); c.alim = cat('Alimentação'); c.dev = cat('DEV Brasil');
    c.alimDev = c.alim + c.dev;

    c.pCoord = sum(m.pag.filter(p => p.p === 'Coordenador'), p => p.v);
    c.pConf = sum(m.pag.filter(p => p.p === 'A confirmar'), p => p.v);
    c.pCx = sum(m.pag.filter(p => p.p === 'Caixa' || p.p === 'Empresa'), p => p.v);
    c.fech = carry; // fechamento do último dia aberto (informado ou calculado) = abertura do mês seguinte
    c.fimCarry = carry;

    c.saldoMes = c.pCoord + c.pConf - c.gab;
    meses.push(c);
  });
  const T = {meses, abertura:meses[0].abertura, fech:meses[meses.length - 1].fech};
  ['ent','gab','outras','assid','custos','bonif','alim','dev','alimDev','outros','fora','pCoord','pConf','pCx','aberto','difDias'].forEach(k => T[k] = sum(meses, c => c[k]));
  let acc = 0, accS = 0;

  const mx = k => meses.reduce((b, c) => c[k] > b[k] ? c : b, meses[0]);
  T.maxGab = mx('gab'); T.maxCustos = mx('custos');

  T.saldoConfirmado = T.pCoord - T.gab;

  const g = {}, f = {};
  S.meses.forEach((m, mi) => m.pag.forEach((p, pi) => {
    if ((p.c === 'Custo / conta paga' || p.c === 'Alimentação') && NUM(p.v) > 0) {
      const gk = (p.g && p.g !== '—') ? p.g : 'A classificar';
      const fk = p.f || p.x || 'Sem fornecedor';
      (g[gk] = g[gk] || {n:gk, m:Array(10).fill(0), t:0, it:[]});
      (f[fk] = f[fk] || {n:fk, m:Array(10).fill(0), t:0, it:[]});
      [g[gk], f[fk]].forEach(o => { o.m[mi] += NUM(p.v); o.t += NUM(p.v); o.it.push([mi, pi]); });
    }
  }));
  T.grupos = Object.values(g).sort((a, b) => b.t - a.t);
  T.forns = Object.values(f).sort((a, b) => b.t - a.t);
  T.custosTot = sum(T.grupos, x => x.t);
  T.maiorGrupo = T.grupos[0] ? T.grupos[0].n : '–';
  return T;
}

/* ===================== gráficos (SVG) ===================== */
const COL = {sang:'var(--red)', ass:'var(--green)', cus:'var(--orange)', ent:'var(--blue)', fech:'var(--olive)', out:'var(--purple)'};
function nice(max) {
  if (max <= 0) return {max:1, step:.25};
  const e = Math.pow(10, Math.floor(Math.log10(max))), f = max / e;

function tipAttr(t) { return ` data-tip="${esc(t)}"`; }
function barChart({labels, series, stacked, h = 190, fmt = brl}) {
  const W = 360, pl = 34, pr = 6, pt = 8, pb = 22, iw = W - pl - pr, ih = h - pt - pb, n = labels.length;
  const tot = labels.map((_, i) => stacked ? sum(series, s => Math.max(0, s.data[i])) : Math.max(...series.map(s => s.data[i]), 0));
  const mn = Math.min(0, ...series.flatMap(s => s.data));
  const nz = nice(Math.max(...tot, 1));
  const lo = mn < 0 ? -nice(-mn).max : 0, span = nz.max - lo;
  const y = v => pt + ih - (v - lo) / span * ih;
  let g = '';
  for (let v = lo; v <= nz.max + 1e-6; v += nz.step) g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl - 4}" y="${y(v) + 3}" text-anchor="end">${short(v)}</text>`;
  const gw = iw / n, k = stacked ? 1 : series.length, bw = Math.min(26, gw * .72 / k);
  let bars = '';
  labels.forEach((lb, i) => {
    const cx = pl + gw * i + gw / 2;
    if (stacked) {
      let base = 0;
      series.forEach(s => { const v = Math.max(0, s.data[i]); if (v > 0) { bars += `<rect x="${cx - bw / 2}" y="${y(base + v)}" width="${bw}" height="${Math.max(.5, y(base) - y(base + v))}" fill="${s.color}" rx="2"${tipAttr(lb + ' · ' + s.name + ': ' + fmt(s.data[i]))}/>`; base += v; } });
    } else {
      series.forEach((s, j) => { const v = s.data[i], x = cx - bw * k / 2 + j * bw; bars += `<rect x="${x}" y="${Math.min(y(v), y(0))}" width="${bw - 1}" height="${Math.max(.5, Math.abs(y(v) - y(0)))}" fill="${s.color}" rx="2"${tipAttr(lb + ' · ' + s.name + ': ' + fmt(v))}/>`; });
    }
    bars += `<text x="${cx}" y="${h - 7}" text-anchor="middle">${esc(lb)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img"><g class="grid">${g}</g>${bars}</svg>` + legend(series);
}
function lineChart({labels, series, h = 180, fmt = brl}) {
  const W = 360, pl = 34, pr = 10, pt = 10, pb = 22, iw = W - pl - pr, ih = h - pt - pb, n = labels.length;
  const all = series.flatMap(s => s.data), mn = Math.min(0, ...all);
  const nz = nice(Math.max(...all, 1)), lo = mn < 0 ? -nice(-mn).max : 0, span = nz.max - lo;
  const x = i => pl + (n === 1 ? iw / 2 : iw * i / (n - 1)), y = v => pt + ih - (v - lo) / span * ih;
  let g = '';
  for (let v = lo; v <= nz.max + 1e-6; v += nz.step) g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl - 4}" y="${y(v) + 3}" text-anchor="end">${short(v)}</text>`;
  let out = '';
  series.forEach((s, si) => {
    const pts = s.data.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    if (si === 0) out += `<polygon points="${x(0)},${y(0)} ${pts} ${x(n - 1)},${y(0)}" fill="${s.color}" opacity=".12"/>`;

    s.data.forEach((v, i) => out += `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="var(--card)" stroke="${s.color}" stroke-width="2"${tipAttr(labels[i] + ' · ' + s.name + ': ' + fmt(v))}/>`);
  });

}
function donut(items) {

function legend(series) { return `<div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`; }

function confChip(cf) {
  if (!cf || cf === '—') return '';
  const cls = cf.indexOf('✔') === 0 ? 'ok' : cf.indexOf('+') === 0 ? 'bl' : cf.indexOf('⚠') === 0 ? 'bad' : cf.indexOf('✖') === 0 ? 'bad' : cf.indexOf('✎') === 0 ? 'am' : 'am';
  return `<span class="chip ${cls}">${esc(cf)}</span>`;
}
function ppSelect(mi, i, v) {
  const cls = v === 'A confirmar' ? 's-conf' : v === 'Coordenador' ? 's-coord' : 's-emp';
  return `<select class="sel-inline ${cls}" data-pp="1" data-m="${mi}" data-i="${i}" aria-label="Pago por">${PAGO.map(o => `<option${o === v ? ' selected' : ''}>${o}</option>`).join('')}</select>`;
}
function rowPag(mi, i, p, showMes) {
  const excl = p.v == null;
  return `<div class="row tap" data-act="pag" data-m="${mi}" data-i="${i}" style="align-items:flex-start;flex-wrap:wrap"><span class="bullet" style="background:${CAT_COLOR[p.c] || 'var(--gray)'}"></span><span class="main"><span class="t">${esc(p.f || p.x)}</span><span class="d">${showMes ? '<b>' + S.meses[mi].abr + '</b> · ' : ''}${esc(p.c)}${p.g && p.g !== '—' ? ' · ' + esc(p.g) : ''}</span><span class="d">${esc(p.x && p.f && p.x !== p.f ? p.x : '')}${nfInfo(p) ? ' · ' + nfInfo(p) : ''}</span><span style="display:flex;gap:6px;flex-wrap:wrap;margin-top:5px">${confChip(p.cf)}</span></span><span class="amt num">${excl ? '<span class="mut">excluído</span>' : brl(p.v)}<small>${ppSelect(mi, i, p.p)}</small></span></div>`;
}
function tabPag(c) {
  const m = c.m, mi = c.mi;
  const cats = ['Todas', ...CATS];
  let h = `<div class="grid"><div class="kpi c-orange"><div class="l">Total fora do caixa</div><div class="v num">${brl(c.fora)}</div><div class="s">${m.pag.filter(p => p.v != null).length} lançamentos</div></div><div class="kpi c-amber"><div class="l">A confirmar</div><div class="v num">${brl(c.pConf)}</div><div class="s">coordenador: ${brl(c.pCoord)}</div></div></div>`;
  h += `<div class="chips" style="margin-top:12px">${cats.map(k => `<button class="pill ${UI.pagCat === k ? 'on' : ''}" data-act="pcat" data-k="${esc(k)}">${esc(k === 'Custo / conta paga' ? 'Custos' : k)}</button>`).join('')}</div>`;
  const items = m.pag.map((p, i) => [p, i]).filter(([p]) => UI.pagCat === 'Todas' || p.c === UI.pagCat);
  if (!items.length) return h + `<div class="card empty">Nenhum pagamento nesta categoria.<br>Toque em <b>+</b> para adicionar.</div>`;
  h += `<div class="list">` + items.map(([p, i]) => rowPag(mi, i, p)).join('') + `</div>`;
  return h;
}

function drill(kind, key) {
  const T = C, o = (kind === 'g' ? T.grupos : T.forns).find(x => x.n === key);
  if (!o) return;
  const body = `<div class="list" style="box-shadow:none;border:1px solid var(--line)">${o.it.map(([mi, pi]) => { const p = S.meses[mi].pag[pi]; return `<div class="row"><span class="bullet" style="background:var(--orange)"></span><span class="main"><span class="t">${esc(p.f || p.x)}</span><span class="d">${S.meses[mi].nome} · ${esc(p.x)}${p.nf ? ' · ' + esc(p.nf) : ''}</span></span><span class="amt num">${brl(p.v)}</span></div>`; }).join('')}</div><div class="kv" style="margin-top:6px"><span><b>Total</b></span><b class="num">${brl(o.t)}</b></div>`;
  openSheet({title:key, body, saveLabel:'Fechar', noCancel:true, onSave:() => true});
}

/* ---- notas fiscais ---- */
function viewNF(T) {
  const validas = S.nf.filter(n => !/(Cópia|apoio)/.test(n.sit));
  const kk = `<div class="grid g4">
    ${kpi('Páginas conferidas', sum(S.meses, m => m.nfPag), '2 arquivos de notas', 'c-brand')}
    ${kpi('Notas válidas lançadas', validas.length, brl0(sum(validas, n => n.v)), 'c-green')}
    ${kpi('Notas incluídas (faltavam)', S.nf.filter(n => n.sit === 'Incluída na planilha').length, 'não constavam no caixa', 'c-blue')}
    ${kpi('Cópias / apoio (não somados)', S.nf.filter(n => /(Cópia|apoio)/.test(n.sit)).length, '', 'c-amber')}
    ${kpi('Lançamentos duplicados excluídos', S.meses.reduce((t, m) => t + m.pag.filter(p => (p.cf || '').indexOf('✖') === 0).length, 0), '', 'c-red')}

  let h = kk + `<h2 class="sec">Notas fiscais por mês</h2><div class="list">`;

    h += `<a class="row tap" style="text-decoration:none;color:inherit" href="Notas_Fiscais/NF_2026-${String(i + 1).padStart(2, '0')}_${m.nome}.pdf" target="_blank" rel="noopener"><span style="font-size:20px">📎</span><span class="main"><span class="t">${m.nome}</span><span class="d">${m.nfPag} página(s) · NF_2026-${String(i + 1).padStart(2, '0')}_${m.nome}.pdf</span></span><span class="amt num">${brl(val)}<small>valor das notas válidas</small></span></a>`;
  });
  h += `</div><h2 class="sec">Índice completo dos documentos</h2>`;
  h += `<div class="search"><input type="search" id="nfq" placeholder="Buscar emitente, documento, observação…" value="${esc(UI.nfQ)}"></div>`;
  h += `<div class="chips">${['Todos', ...S.meses.map(m => m.abr).filter(a => S.nf.some(n => n.m === a))].map(k => `<button class="pill ${UI.nfMes === k ? 'on' : ''}" data-act="nmes" data-k="${k}">${k}</button>`).join('')}</div>`;
  const sits = ['Todas', ...new Set(S.nf.map(n => n.sit))];
  h += `<div class="chips">${sits.map(k => `<button class="pill ${UI.nfSit === k ? 'on' : ''}" data-act="nsit" data-k="${esc(k)}">${esc(k)}</button>`).join('')}</div>`;
  h += `<div class="chips">${['Todos', 'Serra Geral Vertical', 'Outros'].map(k => `<button class="pill ${UI.dest === k ? 'on' : ''}" data-act="ndest" data-k="${k}">${k === 'Outros' ? 'Outro destinatário' : k === 'Todos' ? 'Todos destinatários' : k}</button>`).join('')}</div>`;
  h += `<div id="nflist">${nfList()}</div>`;
  h += `<div class="note" style="padding:0 4px">Destinatário em vermelho = NF emitida para outra empresa (ELEV8 Adventures) ou pessoa física, e não para a Serra Geral Vertical.</div>`;
  return h;
}
function nfList() {
  const q = UI.nfQ.trim().toLowerCase();
  const it = S.nf.filter(n => (UI.nfMes === 'Todos' || n.m === UI.nfMes) && (UI.nfSit === 'Todas' || n.sit === UI.nfSit) &&
    (UI.dest === 'Todos' || (UI.dest === 'Outros' ? n.dest.indexOf('Serra Geral Vertical') < 0 : n.dest.indexOf('Serra Geral Vertical') >= 0)) &&
    (!q || [n.em, n.doc, n.o, n.dest, n.sit].join(' ').toLowerCase().includes(q)));
  if (!it.length) return `<div class="card empty">Nenhuma nota encontrada.</div>`;
  return `<div class="list">` + it.map(n => {
    const cls = /(Cópia)/.test(n.sit) ? 'bad' : /apoio/.test(n.sit) ? 'am' : n.sit === 'Conferida' ? 'ok' : n.sit.indexOf('Incluída') === 0 ? 'bl' : 'am';
    const outro = n.dest.indexOf('Serra Geral Vertical') < 0;
    return `<div class="row" style="align-items:flex-start"><span class="main"><span class="t">${esc(n.em)}</span><span class="d">${esc(n.doc)} · ${fdate(n.d)} · pág. ${esc(n.pg)} · ${n.m}</span><span class="d" style="${outro ? 'color:var(--red)' : ''}">Dest.: ${esc(n.dest)}</span><span class="d">${esc(n.o)}</span><span style="margin-top:5px;display:block"><span class="chip ${cls}">${esc(n.sit)}</span></span></span><span class="amt num">${brl(n.v)}</span></div>`;
  }).join('') + `</div><div class="note" style="padding:0 4px 8px">${it.length} documento(s) · soma ${brl(sum(it, n => n.v))}</div>`;
}

/* ===================== sheets (janelas) ===================== */
let sheetEl = null, scrimEl = null, sheetCfg = null;
function openSheet(cfg) {
  closeSheet(true);

function showTip(el, x, y) {
  tip.textContent = el.getAttribute('data-tip'); tip.classList.add('on');
  const w = tip.offsetWidth; tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, x - w / 2)) + 'px'; tip.style.top = Math.max(8, y - 44) + 'px';
}
function hideTip() { tip.classList.remove('on'); }

document.addEventListener('click', e => {
  const t = e.target;
  const sx = t.closest('[data-tip]');
  if (sx) { showTip(sx, e.clientX, e.clientY); clearTimeout(showTip.t); showTip.t = setTimeout(hideTip, 3000); return; } else hideTip();
  if (t.closest('select')) return;
  if (t.closest('.scrim')) { closeSheet(); return; }
  const sb = t.closest('[data-sx]');
  if (sb && sheetEl && sheetEl.contains(sb)) {
    const a = sb.dataset.sx;
    if (a === 'close') closeSheet();
    else if (a === 'save' && sheetCfg) { if (sheetCfg.onSave() !== false) closeSheet(); }
    else if (a === 'del' && sheetCfg) { if (sheetCfg.onDelete() !== false) closeSheet(); }
    return;
  }
  if (t.closest('.sheet')) return;
  const a = t.closest('[data-act]'); if (!a) return;
  const d = a.dataset, act = d.act;
  const mi = curMes == null ? lastMes() : curMes;
  switch (act) {
    case 'go': setHash(d.go); break;
    case 'mon': setHash('#/mes/' + d.m); break;
    case 'tab': UI.tab = d.t; render(true); break;
    case 'day': sheetDia(mi, +d.i); break;
    case 'apr': sheetAPR(d.d); break;
    case 'lanc': sheetLanc(mi, +d.i); break;
    case 'pag': sheetPag(+(d.m != null ? d.m : mi), +d.i); break;
    case 'pcat': UI.pagCat = d.k; render(true); break;
    case 'pdf': sheetPDF(mi); break;
    case 'obs-add': sheetText('Nova observação', 'Observação', 'ex.: 05/01: abertura não fecha com o fechamento informado', t2 => { S.meses[mi].obs.push(t2); commit('Observação adicionada'); }); break;
    case 'obs-del': if (confirm('Remover esta observação?')) { S.meses[mi].obs.splice(+d.i, 1); commit('Observação removida'); } break;
    case 'cmes': UI.coordMes = +d.m; render(true); break;
    case 'cpp': UI.coordPP = d.k; render(true); break;
    case 'bulk': sheetBulk(); break;
    case 'cmode': UI.custos = d.k; render(true); break;
    case 'drill-g': drill('g', d.k); break;
    case 'drill-f': drill('f', d.k); break;
    case 'nmes': UI.nfMes = d.k; render(true); break;
    case 'nsit': UI.nfSit = d.k; render(true); break;
    case 'ndest': UI.dest = d.k; render(true); break;
  }
});
document.addEventListener('change', e => {
  const s = e.target.closest('select[data-pp]');
  if (s) { const p = S.meses[+s.dataset.m].pag[+s.dataset.i]; p.p = s.value; commit('Pago por: ' + s.value); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'nfq') { UI.nfQ = e.target.value; $('#nflist').innerHTML = nfList(); }
});
$('#fab').addEventListener('click', () => { const mi = curMes == null ? lastMes() : curMes; if (UI.tab === 'lanc') sheetLanc(mi, null); else sheetPag(mi, null); });
$('#btnMenu').addEventListener('click', sheetMenu);
$('#fileIn').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) importJSON(f); });
addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
addEventListener('hashchange', onRoute);
addEventListener('scroll', hideTip, {passive:true});

function upgradeData(manual) {
  if (S.edits > 0) {
    const msg = manual ? `Atualizar os dados (inclui o caixa de 04 a 07/10)? Um backup (.json) dos seus dados atuais será baixado antes.`
      : `Há dados novos (caixa de 04 a 07/10). Você tem ${S.edits} alteração(ões) salvas neste aparelho.\n\nOK = baixar um backup delas e carregar os dados atualizados.\nCancelar = continuar com seus dados atuais (dá para atualizar depois pelo Menu).`;
    if (!confirm(msg)) return;
    exportJSON();
  }
  S = freshState(); saveState(); render(false); toast('Dados atualizados');
}

/* ===================== PWA (manifesto e ícone gerados no próprio arquivo) ===================== */
function setupPWA() {
  try {
    const mk = n => {
      const c = document.createElement('canvas'); c.width = c.height = n; const g = c.getContext('2d'), k = n / 64;
      g.fillStyle = '#2f5d3a'; g.beginPath(); g.roundRect ? g.roundRect(0, 0, n, n, 14 * k) : g.rect(0, 0, n, n); g.fill();
      g.strokeStyle = '#fff'; g.lineCap = 'round'; g.lineWidth = 4 * k; g.beginPath(); g.moveTo(8 * k, 20 * k); g.lineTo(56 * k, 36 * k); g.stroke();
      g.fillStyle = '#f2a33a'; g.beginPath(); g.arc(34 * k, 28.5 * k, 6 * k, 0, 7); g.fill();
      g.lineWidth = 3 * k; g.strokeStyle = '#fff'; g.beginPath(); g.moveTo(34 * k, 34 * k); g.lineTo(34 * k, 44 * k); g.stroke();
      return c.toDataURL('image/png');
    };
    const i192 = mk(192), i512 = mk(512);
    const ap = document.createElement('link'); ap.rel = 'apple-touch-icon'; ap.href = i192; document.head.append(ap);
    if (/^https?:$/.test(location.protocol)) {
      const man = {name:'Caixa Tirolesa dos Cânions 2026', short_name:'Caixa Tirolesa', start_url:location.href.split('#')[0], scope:location.href.split('#')[0].replace(/[^/]*$/, ''), display:'standalone', orientation:'portrait', background_color:'#f3f5f1', theme_color:'#2f5d3a', lang:'pt-BR', icons:[{src:i192, sizes:'192x192', type:'image/png', purpose:'any'}, {src:i512, sizes:'512x512', type:'image/png', purpose:'any'}]};
      const l = document.createElement('link'); l.rel = 'manifest'; l.href = URL.createObjectURL(new Blob([JSON.stringify(man)], {type:'application/manifest+json'})); document.head.append(l);
    }
  } catch (e) {}
}

applyTheme(getTheme());
if (SAVED && SAVED.rev !== REV) { if (SAVED.edits > 0) setTimeout(() => upgradeData(false), 400); else { S = freshState(); saveState(); } }
$('#sub').textContent = '';
setupPWA();
if (!location.hash) { try { history.replaceState(null, '', '#/painel'); } catch (e) {} }
onRoute();
</script>
</body>
